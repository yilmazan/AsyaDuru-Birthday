    <rect x="788" y="86" width="24" height="36" rx="12" opacity=".9"/>
    <rect x="660" y="200" width="16" height="24" rx="8" opacity=".5"/>
    <rect x="924" y="200" width="16" height="24" rx="8" opacity=".55"/>
    <rect x="500" y="214" width="14" height="20" rx="7" opacity=".45"/>
