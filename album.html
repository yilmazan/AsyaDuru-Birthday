<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#FBE4E8">
  <title>Asya Duru</title>
  <link rel="icon" href="assets/img/crown.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/album.css">
  <script type="module" src="assets/js/album.js"></script>
</head>
<body class="album-page">
  <div class="page">
    <div class="topbar">
      <span class="demo-badge" id="demoBadge" hidden data-i18n="album.demoBadge"></span>
      <button type="button" class="pill-btn" id="langBtn" data-i18n="lang.switch"></button>
      <button type="button" class="pill-btn" id="logoutBtn" hidden data-i18n="album.logout"></button>
    </div>

    <!-- ============ giriş ============ -->
    <main id="viewLogin" class="login" hidden>
      <form class="login-card paper" id="loginForm">
        <img class="login-seal" src="assets/img/album/seal.svg" alt="" width="84" height="84">
        <p class="name-script login-name">Asya Duru</p>
        <h1 class="display login-title" data-i18n="album.loginTitle"></h1>
        <p class="login-demo" id="demoHint" hidden data-i18n="album.demoHint"></p>
        <div class="field">
          <label class="field-label" for="email" data-i18n="album.email"></label>
          <input class="input" id="email" name="email" type="email" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false" required>
        </div>
        <div class="field">
          <label class="field-label" for="password" data-i18n="album.password"></label>
          <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <p class="form-error" id="loginError" role="alert" hidden></p>
        <button class="btn btn-primary login-btn" type="submit" id="loginBtn" data-i18n="album.login"></button>
      </form>
    </main>

    <!-- ============ yükleniyor / hata ============ -->
    <div id="viewLoading" class="status-view" hidden>
      <img class="status-crown" src="assets/img/crown.svg" alt="" width="72" height="50">
      <p data-i18n="album.loading"></p>
    </div>
    <div id="viewError" class="status-view" hidden>
      <p id="loadErrorText" role="alert"></p>
      <button type="button" class="btn btn-primary" id="retryBtn" data-i18n="err.retry"></button>
    </div>

    <!-- ============ albüm ============ -->
    <main id="viewAlbum" class="album" hidden>
      <header class="letterhead">
        <img class="letterhead-crown" src="assets/img/crown.svg" alt="" width="64" height="45">
        <h1 class="letterhead-title">
          <span class="name-script">Asya Duru</span>
          <span class="display album-title" data-i18n="album.title"></span>
        </h1>
        <p class="count" id="countLine"></p>
      </header>

      <div class="toolbar" id="toolbar">
        <div class="filters" role="group" data-i18n-aria="album.filters" id="filters">
          <button type="button" class="chip" data-filter="all" aria-pressed="true"><span data-i18n="album.filterAll"></span><span class="chip-n"></span></button>
          <button type="button" class="chip" data-filter="photos" aria-pressed="false"><span data-i18n="album.filterPhotos"></span><span class="chip-n"></span></button>
          <button type="button" class="chip" data-filter="audio" aria-pressed="false"><span data-i18n="album.filterAudio"></span><span class="chip-n"></span></button>
          <button type="button" class="chip" data-filter="favorites" aria-pressed="false"><span data-i18n="album.filterFavorites"></span><span class="chip-n"></span></button>
          <button type="button" class="chip" data-filter="hidden" aria-pressed="false"><span data-i18n="album.filterHidden"></span><span class="chip-n"></span></button>
          <span class="select-wrap">
            <select id="langFilter" class="lang-select" data-i18n-aria="album.langFilter">
              <option value="all" data-i18n="album.langAll"></option>
              <option value="tr" data-i18n="lang.tr"></option>
              <option value="en" data-i18n="lang.en"></option>
            </select>
          </span>
        </div>
        <div class="tools" id="tools" role="group" data-i18n-aria="album.tools">
          <button type="button" class="btn btn-ghost btn-sm" id="slideshowBtn">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 9.2v5.6l4.6-2.8z" fill="currentColor"/></svg>
            <span data-i18n="album.slideshow"></span>
          </button>
          <button type="button" class="btn btn-night btn-sm" id="liveWallBtn">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.6 4.4L18 9l-4.4 1.6L12 15l-1.6-4.4L6 9l4.4-1.6z" fill="currentColor"/><path d="M18.5 14l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z" fill="currentColor"/></svg>
            <span data-i18n="album.liveWall"></span>
          </button>
        </div>
      </div>

      <section class="letters" id="letters" aria-labelledby="countLine" tabindex="-1"></section>

      <div class="empty" id="emptyState" hidden>
        <img class="empty-seal" src="assets/img/album/seal.svg" alt="" width="88" height="88">
        <p class="empty-text" data-i18n="album.empty"></p>
        <a class="btn btn-primary" href="index.html" data-i18n="album.scanToAdd"></a>
        <p class="empty-note" id="notOwnerNote" hidden data-i18n="album.notOwner"></p>
      </div>

      <div class="empty" id="noMatch" hidden>
        <p class="empty-text" data-i18n="album.noMatch"></p>
        <button type="button" class="btn btn-ghost" id="showAllBtn" data-i18n="album.showAll"></button>
      </div>

      <footer class="album-foot" id="albumFoot">
        <button type="button" class="btn btn-ghost btn-sm" id="exportBtn">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 19h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span data-i18n="album.export"></span>
        </button>
      </footer>
    </main>
  </div>

  <!-- ============ fotoğraf ışık kutusu ============ -->
  <dialog class="lightbox" id="lightbox" data-i18n-aria="album.openPhoto">
    <div class="lb-top">
      <p class="lb-count" id="lbCount" aria-live="polite"></p>
      <button type="button" class="lb-btn" id="lbClose" data-i18n-aria="album.close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </button>
    </div>
    <figure class="lb-figure" id="lbFigure">
      <img id="lbImg" alt="">
    </figure>
    <div class="lb-bottom">
      <button type="button" class="lb-btn" id="lbPrev" data-i18n-aria="album.prev">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <p class="lb-caption" id="lbCaption"></p>
      <button type="button" class="lb-btn" id="lbNext" data-i18n-aria="album.next">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </dialog>

  <!-- ============ silme onayı ============ -->
  <dialog class="confirm" id="confirmDlg" aria-labelledby="confirmText">
    <form method="dialog" class="confirm-form">
      <img class="confirm-seal" src="assets/img/album/seal.svg" alt="" width="56" height="56">
      <p class="confirm-text" id="confirmText" data-i18n="album.deleteConfirm"></p>
      <div class="confirm-actions">
        <button class="btn btn-ghost" value="cancel" autofocus data-i18n="album.cancel"></button>
        <button class="btn btn-danger" value="ok" data-i18n="album.delete"></button>
      </div>
    </form>
  </dialog>

  <!-- ============ slayt gösterisi / canlı duvar ============ -->
  <div class="show" id="show" role="dialog" aria-modal="true" tabindex="-1" hidden>
    <div class="show-sky" aria-hidden="true">
      <i class="stars stars-a"></i><i class="stars stars-b"></i><i class="stars stars-c"></i>
      <img class="palace" src="assets/img/album/palace.svg" alt="">
    </div>
    <header class="wall-head">
      <div class="wall-brand">
        <img src="assets/img/crown.svg" alt="" width="96" height="67">
        <span class="name-script">Asya Duru</span>
      </div>
      <div class="wall-qr" id="wallQr">
        <div class="wall-qr-copy">
          <p class="wall-qr-text" data-i18n="album.scanToAdd"></p>
          <p class="wall-qr-url" id="wallUrl"></p>
        </div>
        <img class="wall-qr-img" id="wallQrImg" alt="" width="160" height="160">
      </div>
    </header>
    <div class="show-stage" id="stage"></div>
    <div class="wall-wait" id="wallWait" hidden>
      <img src="assets/img/album/seal.svg" alt="" width="120" height="120">
      <p data-i18n="album.wallWaiting"></p>
    </div>
    <p class="wall-banner" id="wallBanner" role="status" aria-live="polite"></p>
    <div class="env-layer" id="envLayer" aria-hidden="true"></div>
    <p class="wall-status" id="wallStatus" data-state="connecting"><i class="dot"></i><span id="wallStatusText"></span></p>
    <div class="show-controls" id="showControls">
      <button type="button" class="ctl" id="ctlPrev" data-i18n-aria="album.prev">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" class="ctl" id="ctlPause" data-i18n-aria="album.pauseShow">
        <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
        <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z" fill="currentColor"/></svg>
      </button>
      <button type="button" class="ctl" id="ctlNext" data-i18n-aria="album.next">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span class="show-pos" id="showPos"></span>
      <button type="button" class="ctl-exit" id="ctlExit" data-i18n="album.exitShow"></button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
